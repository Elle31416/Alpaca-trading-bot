name: IV-Rank Harvester Scheduled Run

on:
  schedule:
    - cron: '0 14 * * 1-5'   # 14:00 UTC, Mon-Fri — adjust to your market hours
  workflow_dispatch: {}       # lets you trigger it manually from the Actions tab

jobs:
  run-harvester:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      - name: Run the harvester
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python scripts/run_scheduled.py

      - name: Commit updated status data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update status data [automated]"
          file_pattern: docs/data/*.json
