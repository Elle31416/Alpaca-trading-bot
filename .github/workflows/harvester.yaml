name: IV-Rank Harvester Scheduled Run

on:
  schedule:
    - cron: '*/30 13-21 * * 1-5'   # every 30 min, 13:00-21:29 UTC, Mon-Fri — covers 9:30am-4pm ET in both EST and EDT
  workflow_dispatch: {}       # lets you trigger it manually from the Actions tab

jobs:
  run-harvester:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      - name: Run the harvester
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python scripts/run_scheduled.py

      - name: Commit updated status data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update status data [automated]"
          file_pattern: docs/data/*.json
